name: 한지영 텔레그램 -> 디스코드 알림

on:
  schedule:
    - cron: "2-59/5 22,23,0 * * *"    # KST 07:02~09:57, 5분 간격 (아침)
    - cron: "3-59/10 10,11 * * *"     # KST 19:03~20:53, 10분 간격 (저녁, 추가 글 대비)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 새 글 확인 및 디스코드 전송
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_and_notify.py
      - name: 변경사항 커밋
        run: |
          git config user.name "hanjiyoung-discord-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if [ -d reports ]; then
            git add reports/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "state 및 리포트 업데이트 [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push 충돌, 재시도합니다 ($i)"
              sleep $((RANDOM % 10 + 5))
            done
          else
            echo "변경 없음, 커밋 생략"
          fi
